name: "Maintenance"
on:
  # So that PRs touching the same files as the push are updated
  push:
    branches:
      - 'main'
  # So that the `dirtyLabel` is removed if conflicts are resolve
  # We recommend `pull_request_target` so that github secrets are available.
  # In `pull_request` we wouldn't be able to change labels of fork PRs
  pull_request_target:
    types: [synchronize, opened, reopened, ready_for_review]

jobs:
  main:
    if: github.repository == 'cyruzzo/AboveVTT' && (github.event_name == 'push' || (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    steps:
      - name: check if prs are dirty
        uses: eps1lon/actions-label-merge-conflict@v3
        timeout-minutes: 1 
        continue-on-error: true # Prevents issue with PRs with WIP: as thier name since github api interacts with it
        with:
          dirtyLabel: "Conflicting"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "This pull request has conflicts, please resolve those before we can evaluate the pull request."
          commentOnClean: "Conflicts have been resolved. A maintainer will review the pull request soon-ish"
